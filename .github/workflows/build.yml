name: Build XanCalc App Bundle

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'zulu'
        cache: gradle

    - name: Ensure Gradle Wrapper Exists
      run: |
        if [ ! -f "./gradlew" ]; then
          echo "gradlew missing! Generating a fresh wrapper..."
          gradle wrapper
        fi

    - name: Change Gradle Script Permissions
      run: chmod +x ./gradlew

    - name: Setup Android NDK
      run: |
        echo "y" | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.1.8937393"

    - name: Build Release Bundle with R8
      run: ./gradlew bundleRelease

    - name: Upload Output App Bundle (.aab)
      uses: actions/upload-artifact@v4
      with:
        name: XanCalc-Release-Bundle
        path: app/build/outputs/bundle/release/app-release.aab

    - name: Upload Native Debug Symbols (.zip)
      uses: actions/upload-artifact@v4
      with:
        name: XanCalc-Debug-Symbols
        path: app/build/outputs/native_debug_symbols/release/native_debug_symbols.zip
